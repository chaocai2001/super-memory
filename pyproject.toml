[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-memory"
version = "0.1.0"
description = "LLM wiki memory system built from codex session transition logs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
supermemory = "super_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
